services:
  audiocleaner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${AUDIOCLEANER_HOSTNAME}
    hostname: ${AUDIOCLEANER_HOSTNAME}
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    ports:
      - "${AUDIOCLEANER_BIND}:${AUDIOCLEANER_PORT}:9830"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9830/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      CONFIG_PATH: /app/config/config.json
      DB_PATH: /app/data/audiocleaner.db
      LOG_PATH: /app/logs/audiocleaner.log
      BACKUP_ROOT: /app/backups
      WORK_ROOT: /app/work
      HTTP_ADDR: ":9830"
    volumes:
      - ${LOCALTIME_PATH}:/etc/localtime:ro
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./test:/app/test
      - ${AUDIOCLEANER_MEDIA_PATH:-${RESOURCE}/Media}:/media
